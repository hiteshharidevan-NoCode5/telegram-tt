name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove Conflicting NPM Config
        run: rm -f .npmrc

      - name: Install Capacitor Locally
        run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem --legacy-peer-deps --ignore-scripts

      - name: Initialize Android Shell
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure App Name, NuzEPpr Bridge & Back Navigation
        run: |
          # 1. Update Android string resources
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">AltGram</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">AltGram</string>|' android/app/src/main/res/values/strings.xml

          # 2. Hardcode android:label and add <queries> visibility for NuzEPpr (Android 11+)
          sed -i 's/android:label="[^"]*"/android:label="AltGram"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <queries>\n        <package android:name="com.example.epaper_reader" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:mimeType="application/pdf" />\n        </intent>\n    </queries>\n</manifest>|' android/app/src/main/AndroidManifest.xml

          # 3. Force HTML title in web distribution directory
          find dist public -name "*.html" -exec sed -i 's/<title>.*<\/title>/<title>AltGram<\/title>/g' {} + 2>/dev/null || true

          # 3b. Generate Adaptive AltGram Launcher Icon
          pip install pillow && python3 make_altgram_icon.py

          # 4. Patch MainActivity.java (Public Downloads + Direct NuzEPpr Launch + Hardware Back)
          cat << 'JAVAEOF' > android/app/src/main/java/com/custom/telegramweb/MainActivity.java
          package com.custom.telegramweb;

          import android.content.ActivityNotFoundException;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              private static final String NUZEPPR_PACKAGE = "com.example.epaper_reader";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  androidx.core.view.ViewCompat.setOnApplyWindowInsetsListener(getWindow().getDecorView(), (view, windowInsets) -> {
                      androidx.core.graphics.Insets insets = windowInsets.getInsets(
                          androidx.core.view.WindowInsetsCompat.Type.systemBars() |
                          androidx.core.view.WindowInsetsCompat.Type.displayCutout()
                      );
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          android.view.View wv = getBridge().getWebView(); android.view.ViewGroup.MarginLayoutParams mlp = (android.view.ViewGroup.MarginLayoutParams) wv.getLayoutParams(); mlp.setMargins(insets.left, insets.top, insets.right, insets.bottom); wv.setLayoutParams(mlp);
                      }
                      return androidx.core.view.WindowInsetsCompat.CONSUMED; }); androidx.core.view.ViewCompat.requestApplyInsets(getWindow().getDecorView());

                  WebView webView = this.getBridge().getWebView();
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void getBase64FromBlobData(String base64Data, String filename) {
                          saveAndOpenInNuzEPpr(base64Data, filename);
                      }
                  }, "AndroidBlobDownloader");

                  webView.post(() -> injectBlobInterceptor(webView));

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          WebView wv = getBridge().getWebView();
                          if (wv != null) {
                              String backJs = "(function() {" +
                                      "  var closeBtn = document.querySelector('.modal-dialog button[aria-label=\"Close\"], .MediaViewer button[aria-label=\"Close\"]');" +
                                      "  if (closeBtn) { closeBtn.click(); return 'handled'; }" +
                                      "  var backBtn = document.querySelector('#MiddleColumn button[aria-label=\"Back\"], .left-header button[aria-label=\"Back\"], button.Button.smaller.translucent[aria-label=\"Back\"]');" +
                                      "  if (backBtn) { backBtn.click(); return 'handled'; }" +
                                      "  return 'exit';" +
                                      "})();";
                              wv.evaluateJavascript(backJs, result -> {
                                  if (result != null && result.contains("handled")) {
                                      // Handled inside Telegram Web
                                  } else if (wv.canGoBack()) {
                                      wv.goBack();
                                  } else {
                                      moveTaskToBack(true);
                                  }
                              });
                          } else {
                              moveTaskToBack(true);
                          }
                      }
                  });
              }

              @Override
              public void onResume() {
                  super.onResume();
                  WebView webView = this.getBridge().getWebView();
                  if (webView != null) {
                      injectBlobInterceptor(webView);
                  }
              }

              private void injectBlobInterceptor(WebView webView) {
                  String js = "(function() {" +
                          "  if (window.__blobHookInstalled) return;" +
                          "  window.__blobHookInstalled = true;" +
                          "  var origClick = HTMLAnchorElement.prototype.click;" +
                          "  HTMLAnchorElement.prototype.click = function() {" +
                          "    if (this.href && this.href.startsWith('blob:')) {" +
                          "      var filename = this.download || ('file_' + Date.now() + '.pdf');" +
                          "      var url = this.href;" +
                          "      var xhr = new XMLHttpRequest();" +
                          "      xhr.open('GET', url, true);" +
                          "      xhr.responseType = 'blob';" +
                          "      xhr.onload = function() {" +
                          "        if (this.status === 200) {" +
                          "          var reader = new FileReader();" +
                          "          reader.readAsDataURL(this.response);" +
                          "          reader.onloadend = function() {" +
                          "            AndroidBlobDownloader.getBase64FromBlobData(reader.result, filename);" +
                          "          };" +
                          "        }" +
                          "      };" +
                          "      xhr.send();" +
                          "    }" +
                          "    return origClick.apply(this, arguments);" +
                          "  };" +
                          "})();";
                  webView.evaluateJavascript(js, null);
              }

              private void saveAndOpenInNuzEPpr(String base64Data, String filename) {
                  try {
                      String cleanBase64 = base64Data.substring(base64Data.indexOf(",") + 1);
                      byte[] fileBytes = Base64.decode(cleanBase64, Base64.DEFAULT);

                      String mimeType = filename.toLowerCase().endsWith(".pdf") ? "application/pdf" : "application/octet-stream";
                      Uri openUri = null;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/AltGram");

                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              OutputStream os = getContentResolver().openOutputStream(uri);
                              if (os != null) {
                                  os.write(fileBytes);
                                  os.flush();
                                  os.close();
                                  openUri = uri;
                              }
                          }
                      } else {
                          File downloadDir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "AltGram");
                          if (!downloadDir.exists()) downloadDir.mkdirs();
                          File targetFile = new File(downloadDir, filename);
                          FileOutputStream fos = new FileOutputStream(targetFile);
                          fos.write(fileBytes);
                          fos.flush();
                          fos.close();
                          openUri = FileProvider.getUriForFile(this, getApplicationContext().getPackageName() + ".fileprovider", targetFile);
                      }

                      if (openUri != null) {
                          final Uri finalUri = openUri;
                          runOnUiThread(() -> {
                              Intent directIntent = new Intent(Intent.ACTION_VIEW);
                              directIntent.setDataAndType(finalUri, mimeType);
                              directIntent.setPackage(NUZEPPR_PACKAGE);
                              directIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);

                              try {
                                  startActivity(directIntent);
                              } catch (ActivityNotFoundException e) {
                                  Intent fallback = new Intent(Intent.ACTION_VIEW);
                                  fallback.setDataAndType(finalUri, mimeType);
                                  fallback.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(Intent.createChooser(fallback, "Open ePaper with"));
                              }
                          });
                      }
                  } catch (Exception e) {
                      runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Save error: " + e.getMessage(), Toast.LENGTH_LONG).show());
                  }
              }
          }
          JAVAEOF

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AltGram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
