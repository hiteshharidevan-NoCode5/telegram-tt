name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Remove Conflicting NPM Config
        run: rm -f .npmrc

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem --legacy-peer-deps --ignore-scripts
          npm run build:production

      - name: Initialize Android Shell
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure App Name, NuzEPpr Bridge & ePaper Sync
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">AltGram</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">AltGram</string>|' android/app/src/main/res/values/strings.xml

          sed -i 's/android:label="[^"]*"/android:label="AltGram"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <queries>\n        <package android:name="com.example.epaper_reader" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:mimeType="application/pdf" />\n        </intent>\n    </queries>\n</manifest>|' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|    <receiver android:name=".EpaperSyncReceiver" android:exported="false" />\n    </application>|' android/app/src/main/AndroidManifest.xml

          find dist public -name "*.html" -exec sed -i 's/<title>.*<\/title>/<title>AltGram<\/title>/g' {} + 2>/dev/null || true

          pip install pillow && python3 make_altgram_icon.py

          mkdir -p android/app/src/main/java/com/custom/telegramweb
          cp native-android/MainActivity.java android/app/src/main/java/com/custom/telegramweb/MainActivity.java
          cp native-android/EpaperSyncReceiver.java android/app/src/main/java/com/custom/telegramweb/EpaperSyncReceiver.java

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK to AltGram.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/AltGram.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AltGram.apk
          path: android/app/build/outputs/apk/debug/AltGram.apk
          retention-days: 7
