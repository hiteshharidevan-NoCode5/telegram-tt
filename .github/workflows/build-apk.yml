name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove Conflicting NPM Config
        run: rm -f .npmrc

      - name: Install Capacitor Locally
        run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem --legacy-peer-deps --ignore-scripts

      - name: Initialize Android Shell
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure App Name, Permissions & Downloader
        run: |
          # 1. Update Android string resources
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">AltGram</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">AltGram</string>|' android/app/src/main/res/values/strings.xml

          # 2. Hardcode android:label and ensure permissions in AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="AltGram"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|g' android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n</manifest>|' android/app/src/main/AndroidManifest.xml

          # 3. Force HTML title in web distribution directory
          find dist public -name "*.html" -exec sed -i 's/<title>.*<\/title>/<title>AltGram<\/title>/g' {} + 2>/dev/null || true

          # 4. Patch MainActivity.java to write directly into ChromeOS general Downloads
          cat << 'EOF' > android/app/src/main/java/com/custom/telegramweb/MainActivity.java
          package com.custom.telegramweb;

          import android.content.ContentValues;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = this.getBridge().getWebView();
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void getBase64FromBlobData(String base64Data, String filename) {
                          saveToChromeOSDownloads(base64Data, filename);
                      }
                  }, "AndroidBlobDownloader");

                  webView.post(() -> injectBlobInterceptor(webView));
              }

              @Override
              public void onResume() {
                  super.onResume();
                  WebView webView = this.getBridge().getWebView();
                  if (webView != null) {
                      injectBlobInterceptor(webView);
                  }
              }

              private void injectBlobInterceptor(WebView webView) {
                  String js = "(function() {" +
                          "  if (window.__blobHookInstalled) return;" +
                          "  window.__blobHookInstalled = true;" +
                          "  var origClick = HTMLAnchorElement.prototype.click;" +
                          "  HTMLAnchorElement.prototype.click = function() {" +
                          "    if (this.href && this.href.startsWith('blob:')) {" +
                          "      var filename = this.download || ('file_' + Date.now());" +
                          "      var url = this.href;" +
                          "      var xhr = new XMLHttpRequest();" +
                          "      xhr.open('GET', url, true);" +
                          "      xhr.responseType = 'blob';" +
                          "      xhr.onload = function() {" +
                          "        if (this.status === 200) {" +
                          "          var reader = new FileReader();" +
                          "          reader.readAsDataURL(this.response);" +
                          "          reader.onloadend = function() {" +
                          "            AndroidBlobDownloader.getBase64FromBlobData(reader.result, filename);" +
                          "          };" +
                          "        }" +
                          "      };" +
                          "      xhr.send();" +
                          "    }" +
                          "    return origClick.apply(this, arguments);" +
                          "  };" +
                          "})();";
                  webView.evaluateJavascript(js, null);
              }

              private void saveToChromeOSDownloads(String base64Data, String filename) {
                  try {
                      String cleanBase64 = base64Data.substring(base64Data.indexOf(",") + 1);
                      byte[] fileBytes = Base64.decode(cleanBase64, Base64.DEFAULT);

                      boolean savedSuccessfully = false;

                      // Method 1: MediaStore API (Standard ChromeOS Android integration)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                          values.put(MediaStore.Downloads.MIME_TYPE, filename.endsWith(".pdf") ? "application/pdf" : "application/octet-stream");
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);

                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              OutputStream os = getContentResolver().openOutputStream(uri);
                              if (os != null) {
                                  os.write(fileBytes);
                                  os.flush();
                                  os.close();
                                  savedSuccessfully = true;
                              }
                          }
                      }

                      // Method 2: Direct path fallback to /storage/emulated/0/Download
                      if (!savedSuccessfully) {
                          File downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          if (!downloadDir.exists()) {
                              downloadDir.mkdirs();
                          }
                          File targetFile = new File(downloadDir, filename);
                          FileOutputStream fos = new FileOutputStream(targetFile);
                          fos.write(fileBytes);
                          fos.flush();
                          fos.close();

                          // Force ChromeOS Files app to index the new file immediately
                          MediaScannerConnection.scanFile(
                              getApplicationContext(),
                              new String[]{targetFile.getAbsolutePath()},
                              null,
                              null
                          );
                          savedSuccessfully = true;
                      }

                      runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Saved to ChromeOS Downloads: " + filename, Toast.LENGTH_LONG).show());
                  } catch (Exception e) {
                      runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Save error: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AltGram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
