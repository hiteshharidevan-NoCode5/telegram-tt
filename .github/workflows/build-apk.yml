name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove Conflicting NPM Config
        run: rm -f .npmrc

      - name: Install Capacitor Locally
        run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem --legacy-peer-deps --ignore-scripts

      - name: Initialize Android Shell
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure App Name, Permissions & Downloader
        run: |
          # 1. Update Android string resources
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">AltGram</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">AltGram</string>|' android/app/src/main/res/values/strings.xml

          # 2. Hardcode android:label directly in AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="AltGram"/g' android/app/src/main/AndroidManifest.xml

          # 3. Force HTML title in web distribution directory
          find dist public -name "*.html" -exec sed -i 's/<title>.*<\/title>/<title>AltGram<\/title>/g' {} + 2>/dev/null || true

          # 4. Patch MainActivity.java
          cat << 'EOF' > android/app/src/main/java/com/custom/telegramweb/MainActivity.java
          package com.custom.telegramweb;

          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = this.getBridge().getWebView();
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void getBase64FromBlobData(String base64Data, String filename) {
                          convertBase64ToMediaAndSave(base64Data, filename);
                      }
                  }, "AndroidBlobDownloader");

                  webView.post(() -> injectBlobInterceptor(webView));
              }

              @Override
              public void onResume() {
                  super.onResume();
                  WebView webView = this.getBridge().getWebView();
                  if (webView != null) {
                      injectBlobInterceptor(webView);
                  }
              }

              private void injectBlobInterceptor(WebView webView) {
                  String js = "(function() {" +
                          "  if (window.__blobHookInstalled) return;" +
                          "  window.__blobHookInstalled = true;" +
                          "  var origClick = HTMLAnchorElement.prototype.click;" +
                          "  HTMLAnchorElement.prototype.click = function() {" +
                          "    if (this.href && this.href.startsWith('blob:')) {" +
                          "      var filename = this.download || ('file_' + Date.now());" +
                          "      var url = this.href;" +
                          "      var xhr = new XMLHttpRequest();" +
                          "      xhr.open('GET', url, true);" +
                          "      xhr.responseType = 'blob';" +
                          "      xhr.onload = function() {" +
                          "        if (this.status === 200) {" +
                          "          var reader = new FileReader();" +
                          "          reader.readAsDataURL(this.response);" +
                          "          reader.onloadend = function() {" +
                          "            AndroidBlobDownloader.getBase64FromBlobData(reader.result, filename);" +
                          "          };" +
                          "        }" +
                          "      };" +
                          "      xhr.send();" +
                          "    }" +
                          "    return origClick.apply(this, arguments);" +
                          "  };" +
                          "})();";
                  webView.evaluateJavascript(js, null);
              }

              private void convertBase64ToMediaAndSave(String base64Data, String filename) {
                  try {
                      String cleanBase64 = base64Data.substring(base64Data.indexOf(",") + 1);
                      byte[] fileBytes = Base64.decode(cleanBase64, Base64.DEFAULT);

                      File dir = getExternalFilesDir(null);
                      if (dir != null && !dir.exists()) {
                          dir.mkdirs();
                      }

                      File file = new File(dir, filename);
                      FileOutputStream os = new FileOutputStream(file, false);
                      os.write(fileBytes);
                      os.flush();
                      os.close();

                      runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Saved: " + filename, Toast.LENGTH_LONG).show());
                  } catch (Exception e) {
                      runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Save error: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AltGram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
