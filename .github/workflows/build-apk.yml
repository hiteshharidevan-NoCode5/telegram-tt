name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove Conflicting NPM Config
        run: rm -f .npmrc

      - name: Install Capacitor Locally
        run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/filesystem --legacy-peer-deps --ignore-scripts

      - name: Initialize Android Shell
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure App Name, Permissions & Downloader
        run: |
          # 1. Set the exact app title shown on launcher/home screen
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">AltGram</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">AltGram</string>|' android/app/src/main/res/values/strings.xml

          # 2. Add storage permissions to AndroidManifest.xml
          sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml

          # 3. Patch MainActivity.java to save blob downloads to /sdcard/Download
          cat << 'EOF' > android/app/src/main/java/com/custom/telegramweb/MainActivity.java
          package com.custom.telegramweb;

          import android.os.Bundle;
          import android.os.Environment;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = this.getBridge().getWebView();
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void getBase64FromBlobData(String base64Data, String filename, String mimetype) {
                          convertBase64ToMediaAndSave(base64Data, filename);
                      }
                  }, "AndroidBlobDownloader");

                  webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      if (url.startsWith("blob:")) {
                          String js = "var xhr = new XMLHttpRequest();" +
                                  "xhr.open('GET', '" + url + "', true);" +
                                  "xhr.responseType = 'blob';" +
                                  "xhr.onload = function() {" +
                                  "  if (this.status === 200) {" +
                                  "    var blob = this.response;" +
                                  "    var reader = new FileReader();" +
                                  "    reader.readAsDataURL(blob);" +
                                  "    reader.onloadend = function() {" +
                                  "      var base64data = reader.result;" +
                                  "      AndroidBlobDownloader.getBase64FromBlobData(base64data, 'telegram_' + Date.now(), '" + mimetype + "');" +
                                  "    };" +
                                  "  }" +
                                  "};" +
                                  "xhr.send();";
                          webView.evaluateJavascript(js, null);
                      }
                  });
              }

              private void convertBase64ToMediaAndSave(String base64Data, String filename) {
                  try {
                      String cleanBase64 = base64Data.substring(base64Data.indexOf(",") + 1);
                      byte[] pdfAsBytes = Base64.decode(cleanBase64, Base64.DEFAULT);

                      File path = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!path.exists()) {
                          path.mkdirs();
                      }

                      File file = new File(path, filename);
                      FileOutputStream os = new FileOutputStream(file, false);
                      os.write(pdfAsBytes);
                      os.flush();
                      os.close();

                      runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Saved to Downloads: " + filename, Toast.LENGTH_LONG).show());
                  } catch (IOException e) {
                      runOnUiThread(() -> Toast.makeText(getApplicationContext(), "Failed to save file", Toast.LENGTH_SHORT).show());
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AltGram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
